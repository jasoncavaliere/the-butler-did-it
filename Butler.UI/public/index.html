<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="Butler - the household concierge for the family's shared tablet."
    />

    <!--
      PWA (O1). The manifest + a registered service worker + an https/localhost origin are what
      make the hub installable on the family tablet. The manifest and its icons ship from
      `public/`, which `expo export --platform web` copies verbatim into `dist/`
      (https://docs.expo.dev/guides/progressive-web-apps/). The service worker itself is
      registered from the app bundle (src/pwa/registerServiceWorker.ts), not from this file.
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F5A54" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Butler" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
