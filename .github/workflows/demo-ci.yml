# CI gate for the local Docker Compose demo stack (demo/, issue #94).
#
# Path-filtered: this runs when a change touches demo/**, Butler.API/** or
# Butler.UI/** (or this workflow file itself). The stack job builds the API
# image from Butler.API (demo/docker-compose.yml api.build.context
# ../Butler.API) and the hub export from Butler.UI, so running on those PRs
# catches demo breakage on the PR that causes it (#177). The cost is one extra
# stack boot per API/UI PR on top of api-ci.yml and ui-ci.yml, and the
# concurrency group below cancels stale runs.
#
# Two jobs:
#   config - static checks: the compose file is valid (`docker compose config`
#            exits 0), Azurite is pinned with its data bind-mounted to
#            demo/.data/azurite, the API gets an explicit TableEndpoint
#            connection string, demo/ creates no tables, demo/.data is
#            git-ignored, and demo/README.md documents the commands. Also the
#            demo CLI (#102): demo.sh and demo.ps1 parse, print the same usage
#            and exit non-zero for no/unknown subcommands, every subcommand is
#            in demo/README.md, and they drive the single compose file. And
#            share/unshare (#101) against a stub tailscale through both
#            scripts (demo/ci/check-share.sh static), run once with the npx
#            qrcode-terminal QR fallback and once with qrencode installed.
#            And the API's log folder (#107) is bind-mounted from
#            demo/.data/logs to /app/logs. And the organizer PIN (#105):
#            demo/.env is git-ignored and untracked, compose passes
#            BUTLER_DEMO_PIN to the API, no PIN is committed, and `up` without
#            a PIN fails fast with the same message through both scripts.
#            And the Fully Kiosk hub settings (#129,
#            demo/ci/check-fully-settings.sh): placeholder-only start URL and
#            kiosk PIN, pinned values, no secrets, every key documented.
#            And the hub tablet provisioning scripts (#128,
#            demo/ci/check-provision-tablet.sh): against a fake adb, both
#            scripts abort before any change on each failed pre-check, print
#            the same dry-run command list, and push the same settings copy.
#            And a failed export build (#183,
#            demo/ci/check-export-failure.sh): with a stub npm whose build:web
#            fails after writing dist/index.html, both scripts delete that
#            marker and the next `up` rebuilds the export.
#            And the export build stamp (#184,
#            demo/ci/check-export-stamp.sh): with stub npm and docker, an
#            export without up's matching, current
#            Butler.UI/dist/.demo-build-env (a hand build) is rebuilt with
#            EXPO_PUBLIC_API_BASE_URL=/api, and both scripts write and read
#            the same stamp. And the logs arguments (#190,
#            demo/ci/check-logs-args.sh): with a stub docker, naming a
#            compose service (`logs -f azurite`) narrows the logs call to
#            that service, and both scripts make the same call.
#            And an unwritable log folder (#193,
#            demo/ci/check-logs-dir.sh): with stub npm and docker, a
#            read-only or root-owned demo/.data makes up print the
#            file-log-off warning and the chown fix on stdout, identically
#            through both scripts, while a writable one prints nothing extra.
#            And reset (#98, demo/ci/check-reset.sh static): with a stub
#            docker, a missing PIN and every non-local target (remote engine,
#            other compose project, non-Azurite storage, other data folder)
#            exit 1 with the same message through both scripts and make no
#            down, run or up call.
#            And the smoke step (#103): Azurite's Table port is published
#            only on 127.0.0.1:10012 while the api keeps azurite:10002, and
#            demo/ci/check-smoke-step.sh (stub dotnet and docker) shows both
#            scripts run the Liveness and Endpoints smoke tests from
#            Butler.API/ with the smoke environment after a healthy stack,
#            print Demo ready on a pass, name each failed test on a failure,
#            and stop before npm or docker without a .NET SDK.
#   stack  - boots the real stack (Azurite + API + Caddy), checks the hub and
#            its service worker on :8080 (with the precache list build:web
#            injects, demo/ci/check-precache.cjs, #178; its exit codes
#            checked by demo/ci/check-precache-exit.sh, #259), the single origin
#            (SPA fallback, cache headers, /api proxy, #96), a household created and read back
#            through the hub UI with every API call same-origin (#96), the
#            API's table provisioning, and that a household survives `down` +
#            `up`. Then runs the demo CLI against it (#102): status, logs,
#            up and down through both demo.sh and demo.ps1 with the same
#            output, down keeping the data, and up rebuilding a missing or
#            stale hub export and waiting for every service to be healthy.
#            Also checks that Caddy keeps serving :8080 while share is on and
#            after unshare (#101, demo/ci/check-share.sh stack). And the Demo
#            request log (#107): a 404's traceId appears as the CorrelationId
#            in demo/.data/logs, `demo logs` follows api and web together, and
#            `demo logs --api` shows only the API, and `demo logs ... azurite`
#            shows only Azurite through both scripts (#190). The health
#            probes stay out of the request logs (#192): no Caddy access line
#            for its loopback healthcheck while a host request to / is still
#            logged, and no GET /health line in the API file. The API runs
#            with the PIN organizer (#105): the job writes a random CI-only
#            PIN to the git-ignored demo/.env, builds the hub with
#            EXPO_PUBLIC_AUTH_PROVIDER=pin, and signs in through
#            POST /auth/pin/sign-in before every organizer call (again after
#            every restart, since tokens live in API memory). And reset
#            (#98, demo/ci/check-reset.sh stack): demo.sh reset, demo.ps1
#            reset and a reset from a stopped stack, each with stdin closed,
#            wipe the data, re-seed The Parker Household (roster, this week's
#            assignments, fairness) and change the dataset id. And the smoke
#            step (#103): with the SDK from Butler.API/global.json, demo up
#            runs the real Liveness and Rooms smoke tests through the proxy
#            (signing in with the PIN, reading Azurite on 127.0.0.1:10012),
#            never the Demo, Storage or Provisioning ones, and ends with the
#            Demo ready line; a guard step pins the VSTest Failed-line format
#            the scripts parse.
name: demo-ci

on:
  pull_request:
    paths:
      - "demo/**"
      - "Butler.API/**"
      - "Butler.UI/**"
      - ".github/workflows/demo-ci.yml"
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "Butler.API/**"
      - "Butler.UI/**"
      - ".github/workflows/demo-ci.yml"

# Least privilege: both jobs only read the checked-out source.
permissions:
  contents: read

# Supersede in-flight runs for the same ref so a new push cancels stale work.
concurrency:
  group: demo-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE_PATH: demo/docker-compose.yml

jobs:
  config:
    name: compose config + static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AC10: the compose file parses and resolves (exit code 0).
      - name: Validate compose file
        run: docker compose -f "$COMPOSE_FILE_PATH" config --quiet

      # Render once so the following greps check the resolved config (absolute
      # bind sources, interpolated values) rather than the raw source text.
      - name: Render compose config
        run: docker compose -f "$COMPOSE_FILE_PATH" config > "$RUNNER_TEMP/compose.yml"

      # AC2: official Azurite image at a pinned tag, data bind-mounted to
      # demo/.data/azurite.
      - name: Assert pinned Azurite image and bind mount
        run: |
          grep -E '^\s+image: mcr\.microsoft\.com/azure-storage/azurite:[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/compose.yml"
          grep -E 'source: .*/demo/\.data/azurite$' "$RUNNER_TEMP/compose.yml"

      # #107 AC1: the API's rolling log files land in demo/.data/logs (mounted
      # at /app/logs, where DemoLogging:DirectoryPath "logs" resolves).
      - name: Assert API log folder bind mount
        run: |
          grep -E 'source: .*/demo/\.data/logs$' "$RUNNER_TEMP/compose.yml"
          grep -E 'target: /app/logs$' "$RUNNER_TEMP/compose.yml"
          git check-ignore -q demo/.data/logs/probe

      # AC4: explicit connection string to the azurite service, never the
      # UseDevelopmentStorage shortcut (which resolves to the api container).
      - name: Assert explicit TableEndpoint connection string
        run: |
          grep -F 'TableEndpoint=http://azurite:10002/devstoreaccount1' "$RUNNER_TEMP/compose.yml"
          if grep -n 'UseDevelopmentStorage' "$RUNNER_TEMP/compose.yml"; then
            echo "demo compose must not use UseDevelopmentStorage=true" >&2
            exit 1
          fi

      # #103 AC8b + AC8c: Azurite's Table port is published once, on loopback
      # only (127.0.0.1:10012 -> 10002, never 0.0.0.0), for the host smoke
      # step, and the api still reaches Azurite at azurite:10002. The JSON
      # render is checked with jq and never printed (it holds the PIN).
      - name: "Azurite table port on loopback 10012 only (#103)"
        run: |
          docker compose -f "$COMPOSE_FILE_PATH" config --format json > "$RUNNER_TEMP/compose.json"
          jq -e '
            (.services.azurite.ports // []) as $p
            | ($p | length) == 1
              and ($p[0].host_ip == "127.0.0.1")
              and (($p[0].target | tostring) == "10002")
              and (($p[0].published | tostring) == "10012")
          ' "$RUNNER_TEMP/compose.json" > /dev/null || {
            echo "azurite must publish exactly one port: 127.0.0.1:10012 -> 10002" >&2
            jq -c '.services.azurite.ports' "$RUNNER_TEMP/compose.json" >&2
            exit 1
          }
          jq -e '
            [.services[] | (.ports // [])[] | select((.target | tostring) == "10002")]
            | all(.host_ip == "127.0.0.1")
          ' "$RUNNER_TEMP/compose.json" > /dev/null || {
            echo "Azurite's 10002 must never be published on 0.0.0.0 or without a host IP" >&2
            exit 1
          }
          jq -e '
            .services.api.environment.Storage__ConnectionString
            | contains(";TableEndpoint=http://azurite:10002/devstoreaccount1;")
          ' "$RUNNER_TEMP/compose.json" > /dev/null || {
            echo "the api must still use TableEndpoint=http://azurite:10002/devstoreaccount1" >&2
            exit 1
          }
          echo "azurite: 127.0.0.1:10012 -> 10002 only; api: azurite:10002"

      # AC7: tables come from the API's startup provisioning (#91), not demo/.
      - name: Assert no table creation in demo/
        run: |
          if grep -rnE 'CreateIfNotExists|CreateTable|az storage table create' demo/; then
            echo "demo/ must not create tables - the API provisions them (#91)" >&2
            exit 1
          fi

      # AC9: the Azurite data folder is git-ignored.
      - name: Assert demo/.data is git-ignored
        run: git check-ignore -q demo/.data/azurite/probe

      # #105 AC16 + AC16b: the organizer PIN lives only in the git-ignored
      # demo/.env, compose hands it to the API, and no config file in the repo
      # commits a PIN value.
      - name: "Organizer PIN: demo/.env ignored, untracked, passed by compose, never committed"
        run: |
          git check-ignore -q demo/.env
          if git ls-files --error-unmatch demo/.env > /dev/null 2>&1; then
            echo "demo/.env must not be tracked" >&2
            exit 1
          fi
          grep -F 'BUTLER_DEMO_PIN: ${BUTLER_DEMO_PIN:-}' demo/docker-compose.yml
          grep -E '^\s+BUTLER_DEMO_PIN: ' "$RUNNER_TEMP/compose.yml"
          if git grep -nE "BUTLER_DEMO_PIN[\"']?[[:space:]]*[:=][[:space:]]*[\"']?[0-9]{4,6}" -- '*.json' '*.yml' '*.yaml' '*.env' '*.props' '*.csproj'; then
            echo "a BUTLER_DEMO_PIN value is committed in a config file" >&2
            exit 1
          fi

      # AC8: prerequisites and the up/down commands are documented.
      - name: Assert demo README documents prerequisites and commands
        run: |
          grep -F 'Docker Desktop' demo/README.md
          grep -F 'docker compose -f demo/docker-compose.yml up -d' demo/README.md
          grep -F 'docker compose -f demo/docker-compose.yml down' demo/README.md
          # #96: the /api build and the doubled system prefix are documented.
          grep -F 'EXPO_PUBLIC_API_BASE_URL=/api' demo/README.md
          grep -F '/api/api/system/ping' demo/README.md
          # #101 AC8: the tablet section covers Tailscale, a local CA and adb reverse.
          grep -F '## Connecting a tablet' demo/README.md
          grep -F 'tailscale serve --bg 8080' demo/README.md
          grep -F 'mkcert' demo/README.md
          grep -F 'adb reverse tcp:8080 tcp:8080' demo/README.md
          # #103 AC8: the smoke step, its .NET SDK prerequisite and the
          # loopback Azurite port are documented.
          grep -F '.NET 10 SDK' demo/README.md
          grep -F '### Smoke step' demo/README.md
          grep -F 'Demo ready:' demo/README.md
          grep -F '127.0.0.1:10012' demo/README.md

      # #129 AC1-AC4: the Fully Kiosk settings file has the hub settings with
      # only the __START_URL__ and __KIOSK_PIN__ placeholders (no real PIN or
      # secret), and demo/tablet/README.md documents every key and the import.
      - name: "Tablet: Fully settings file is placeholder-only and documented (#129)"
        run: bash demo/ci/check-fully-settings.sh

      # #128 AC1-AC12: the provisioning scripts, both twins, against a fake adb
      # and a fake tailscale. pwsh and jq are preinstalled on ubuntu-latest.
      - name: "Tablet: provision-tablet scripts against a fake adb (#128)"
        run: bash demo/ci/check-provision-tablet.sh

      # #102 AC7-AC11: the demo CLI scripts. pwsh is preinstalled on
      # ubuntu-latest. No stack is needed: usage is printed before docker is
      # touched.
      - name: "demo CLI: usage, unknown subcommand, parity, README"
        run: |
          bash -n demo/demo.sh
          pwsh -NoProfile -Command '$t = $null; $e = $null; $null = [System.Management.Automation.Language.Parser]::ParseFile("demo/demo.ps1", [ref]$t, [ref]$e); if ($e) { $e; exit 1 }'
          # AC7 + AC8: no subcommand and an unknown one both print the command
          # list and exit non-zero, with identical output from both scripts.
          for args in "" "bogus"; do
            set +e
            # shellcheck disable=SC2086 - an empty $args must expand to nothing.
            sh_out="$(bash demo/demo.sh $args 2>&1)"; sh_rc=$?
            # shellcheck disable=SC2086
            ps_out="$(pwsh -NoProfile -File demo/demo.ps1 $args 2>&1)"; ps_rc=$?
            set -e
            echo "args='$args' demo.sh exit=$sh_rc demo.ps1 exit=$ps_rc"
            printf '%s\n' "$sh_out"
            if [ "$sh_rc" -eq 0 ] || [ "$ps_rc" -eq 0 ]; then
              echo "expected a non-zero exit for args='$args'" >&2
              exit 1
            fi
            if [ "$sh_rc" -ne "$ps_rc" ]; then
              echo "exit codes differ for args='$args'" >&2
              exit 1
            fi
            if [ "$sh_out" != "$ps_out" ]; then
              echo "demo.sh and demo.ps1 print different output for args='$args'" >&2
              diff <(printf '%s\n' "$sh_out") <(printf '%s\n' "$ps_out") || true
              exit 1
            fi
            for cmd in up down reset status logs share unshare; do
              printf '%s\n' "$sh_out" | grep -qE "^  $cmd " || { echo "usage does not list '$cmd'" >&2; exit 1; }
            done
          done
          # #105: `up` with no BUTLER_DEMO_PIN (no demo/.env, none in the
          # environment) fails fast - before npm or docker run - with the same
          # message and exit code from both scripts.
          test ! -e demo/.env
          set +e
          sh_out="$(env -u BUTLER_DEMO_PIN bash demo/demo.sh up 2>&1)"; sh_rc=$?
          ps_out="$(env -u BUTLER_DEMO_PIN pwsh -NoProfile -File demo/demo.ps1 up 2>&1)"; ps_rc=$?
          set -e
          echo "up without a PIN: demo.sh exit=$sh_rc demo.ps1 exit=$ps_rc"
          printf '%s\n' "$sh_out"
          expected='demo/.env must set BUTLER_DEMO_PIN to a 4-6 digit PIN. See demo/README.md.'
          [ "$sh_rc" -eq 1 ] && [ "$ps_rc" -eq 1 ] || { echo "up without a PIN must exit 1" >&2; exit 1; }
          [ "$sh_out" = "$expected" ] || { echo "demo.sh printed the wrong PIN message" >&2; exit 1; }
          [ "$ps_out" = "$expected" ] || { echo "demo.ps1 printed the wrong PIN message" >&2; exit 1; }
          test ! -e Butler.UI/node_modules
          # AC10: every subcommand in the usage is documented in demo/README.md.
          set +e
          names="$(bash demo/demo.sh 2>&1 | awk '/^  [a-z]/{print $1}')"
          set -e
          count="$(printf '%s\n' "$names" | grep -c . || true)"
          if [ "$count" -lt 7 ]; then
            echo "expected at least 7 subcommands in the usage, parsed $count" >&2
            exit 1
          fi
          for name in $names; do
            grep -qF "demo.sh $name" demo/README.md || { echo "demo/README.md does not document 'demo.sh $name'" >&2; exit 1; }
          done
          # AC9: one compose file in the repo, and both scripts drive it.
          compose_files="$(git ls-files '*compose*.yml' '*compose*.yaml')"
          echo "compose files: $compose_files"
          [ "$(printf '%s\n' "$compose_files" | grep -c .)" -eq 1 ]
          grep -qF 'docker-compose.yml' demo/demo.sh
          grep -qF 'docker-compose.yml' demo/demo.ps1
          # AC11: the API README separates the API-only loop from the demo.
          grep -F 'API-only dev loop' Butler.API/README.md
          grep -F 'demo/demo.sh' Butler.API/README.md

      # #101: share/unshare against a stub tailscale, through both scripts.
      # Node provides npx for the qrcode-terminal QR fallback.
      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # #101 AC1-AC6: no qrencode yet, so the QR code comes from npx
      # qrcode-terminal.
      - name: "demo CLI: share/unshare (npx QR fallback)"
        run: bash demo/ci/check-share.sh static

      - name: Install qrencode
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qrencode

      # #101 AC5: with qrencode on PATH, the QR code is its ansiutf8 output.
      - name: "demo CLI: share/unshare (qrencode)"
        run: bash demo/ci/check-share.sh static

      # #183 AC1-AC2: a failed build:web leaves no dist/index.html, so the next
      # up rebuilds; demo.sh and demo.ps1 behave the same. Stub npm and docker.
      - name: "demo CLI: failed export build is rebuilt by the next up (#183)"
        run: bash demo/ci/check-export-failure.sh

      # #184 AC1-AC2: an export up did not build with the demo settings (no
      # matching, current dist/.demo-build-env) is rebuilt; demo.sh and
      # demo.ps1 behave the same and read each other's stamp. Stub npm and docker.
      - name: "demo CLI: export without the demo build stamp is rebuilt by up (#184)"
        run: bash demo/ci/check-export-stamp.sh

      # #190 AC1-AC3, AC5: naming a compose service narrows the logs call to
      # it (the api web default applies only when none is named); demo.sh and
      # demo.ps1 make the same docker call. Stub docker.
      - name: "demo CLI: logs narrows to a named service (#190)"
        run: bash demo/ci/check-logs-args.sh

      # #193 AC1-AC3, AC5: when up cannot make demo/.data/logs writable
      # (read-only or root-owned demo/.data), it prints the file-log-off
      # warning and the chown fix on stdout and still starts the stack; a
      # writable folder prints nothing extra; demo.sh and demo.ps1 print the
      # same bytes. Stub npm and docker; root-owned cases use sudo.
      - name: "demo CLI: unwritable demo/.data/logs is reported on stdout (#193)"
        run: bash demo/ci/check-logs-dir.sh

      # #103 AC1-AC7 + AC8b: the smoke step up runs after a healthy stack,
      # through both scripts: dotnet test from Butler.API/ with the smoke
      # environment and the Liveness|Endpoints filter, Demo ready on a pass,
      # each failed test named once on a failure, the SDK message (before npm
      # or docker) without a .NET SDK, and no smoke run when the stack is not
      # healthy; demo.sh and demo.ps1 print the same bytes and make the same
      # calls. Stub dotnet, docker and npm.
      - name: "demo CLI: up runs the smoke step (#103)"
        run: bash demo/ci/check-smoke-step.sh

      # #98 AC7 + AC8 + AC8b: reset refuses every non-local target and a
      # missing PIN before it touches the stack, stops on a failed down or
      # wipe, and is documented; demo.sh and demo.ps1 print the same bytes
      # and make the same docker calls. Stub docker.
      - name: "demo CLI: reset refuses non-local targets (#98)"
        run: bash demo/ci/check-reset.sh static

  stack:
    name: stack (Azurite + API + Caddy)
    needs: config
    runs-on: ubuntu-latest
    env:
      API_URL: http://127.0.0.1:5108
      HUB_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      # #105: the Demo API signs the organizer in with a PIN and will not start
      # without one. Generate a random CI-only PIN, mask it, and put it where
      # the demo reads it (the git-ignored demo/.env) and in the job env so
      # later steps (and the Playwright flow) can sign in with it.
      - name: Generate a CI-only organizer PIN
        run: |
          pin="$(shuf -i 1000-999999 -n 1)"
          echo "::add-mask::$pin"
          printf 'BUTLER_DEMO_PIN=%s\n' "$pin" > demo/.env
          echo "BUTLER_DEMO_PIN=$pin" >> "$GITHUB_ENV"
          git check-ignore -q demo/.env

      # #103: demo up runs the smoke suite with the host .NET SDK. Pin it from
      # Butler.API/global.json, as api-ci.yml does.
      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: Butler.API/global.json

      # #103 AC6: demo.sh and demo.ps1 name a failed smoke check by parsing
      # VSTest's "  Failed <name> [<duration>]" lines, and
      # demo/ci/check-smoke-step.sh stubs that output. Pin the real format:
      # run the Liveness tests against a dead port and expect that line.
      - name: "Smoke step: real VSTest Failed-line format (#103)"
        working-directory: Butler.API
        env:
          BUTLER_SMOKE_BASE_URL: http://127.0.0.1:9/
          MSBUILDTERMINALLOGGER: "off"
          DOTNET_NOLOGO: "1"
        run: |
          set +e
          out="$(dotnet test src/Butler.Api.SmokeTests/Butler.Api.SmokeTests.csproj --filter 'Category=Liveness' --logger 'console;verbosity=normal' 2>&1)"; rc=$?
          set -e
          printf '%s\n' "$out" | grep -vE '^[[:space:]]*(at |\[xUnit\.net)' | tail -n 40
          [ "$rc" -ne 0 ] || { echo "the smoke tests passed against a dead port" >&2; exit 1; }
          printf '%s\n' "$out" | tr -d '\r' | grep -E '^[[:space:]]*Failed Butler\.Api\.SmokeTests\.LivenessSmokeTests\.Get_health_returns_200_with_status_ok \[[^][]*\]$' \
            || { echo "VSTest no longer prints '  Failed <name> [<duration>]'; update demo.sh, demo.ps1 and check-smoke-step.sh" >&2; exit 1; }

      # Same Node pin and npm cache as ui-ci.yml.
      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Butler.UI/package-lock.json

      # The web service serves the host-built export; build:web (not a bare
      # expo export) also injects the precache list into dist/sw.js. The /api
      # base is inlined at bundle time so the hub calls the API same-origin, and
      # the PIN provider so the hub signs the organizer in on the PIN pad (#105).
      - name: Build the hub export
        working-directory: Butler.UI
        env:
          EXPO_PUBLIC_API_BASE_URL: /api
          EXPO_PUBLIC_AUTH_PROVIDER: pin
        run: |
          npm ci
          npm run build:web

      # AC1: all three services come up and stay running. The API runs as a
      # non-root user, so its log folder is created writable first (#107), as
      # demo up does.
      - name: Start the stack
        run: |
          mkdir -p demo/.data/logs
          chmod 777 demo/.data/logs
          docker compose -f "$COMPOSE_FILE_PATH" up -d --build --wait --wait-timeout 240
          running="$(docker compose -f "$COMPOSE_FILE_PATH" ps --services --status running | sort | tr '\n' ' ')"
          echo "running: $running"
          if [ "$running" != "api azurite web " ]; then
            echo "expected services 'api azurite web ' to be running, got '$running'" >&2
            exit 1
          fi

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fs "$API_URL/health" > /dev/null; then
              echo "API is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy within 60s" >&2
          exit 1

      # #107 AC1 + AC5: a request writes a structured line to the rolling file
      # in demo/.data/logs, and the RFC 7807 traceId of an error response is
      # that line's CorrelationId. The line is written after the response, so
      # allow a few seconds for it to land.
      - name: "API writes request logs to demo/.data/logs (#107)"
        run: |
          # An organizer read (#105: sign in with the PIN first) of an unknown
          # household is a 404 problem carrying the traceId.
          token="$(curl -fsS -X POST "$API_URL/auth/pin/sign-in" -H 'Content-Type: application/json' \
            -d "{\"pin\":\"$BUTLER_DEMO_PIN\"}" | jq -er '.token')"
          body="$(curl -sS -H "Authorization: Bearer $token" "$API_URL/households/ci-log-probe")"
          echo "$body"
          trace="$(printf '%s' "$body" | jq -er '.traceId')"
          echo "traceId: $trace"
          for i in $(seq 1 10); do
            line="$(sudo sh -c 'cat demo/.data/logs/butler-api-*.log' 2>/dev/null | grep -F "\"CorrelationId\":\"$trace\"" || true)"
            [ -n "$line" ] && break
            sleep 0.5
          done
          ls -l demo/.data/logs
          if [ -z "$line" ]; then
            echo "no log line with CorrelationId $trace in demo/.data/logs" >&2
            exit 1
          fi
          echo "$line"
          printf '%s\n' "$line" | grep -qF '"HouseholdId":"ci-log-probe"'
          printf '%s\n' "$line" | grep -qF '"StatusCode":404'
          printf '%s\n' "$line" | grep -qF '"Path":"/households/ci-log-probe"'
          printf '%s\n' "$line" | grep -qE '"ElapsedMs":[0-9.]+'

      # #192 AC1-AC3: the compose healthchecks (Caddy's loopback wget of / every
      # 2s, the API's GET /health every 5s) write no request-log lines, while a
      # host request to the hub is still in Caddy's access log. Both probes have
      # run many times by now (the stack has been healthy for a while).
      - name: "Health probes stay out of the request logs (#192)"
        run: |
          curl -fsS -o /dev/null "$HUB_URL/"
          sleep 1
          web_log="$(docker compose -f "$COMPOSE_FILE_PATH" logs --no-color web | grep -F 'http.log.access' || true)"
          if printf '%s\n' "$web_log" | grep -qF '"remote_ip":"127.0.0.1"'; then
            printf '%s\n' "$web_log" | grep -F '"remote_ip":"127.0.0.1"' | tail -n 3
            echo "Caddy logged its own loopback healthcheck probe" >&2
            exit 1
          fi
          if ! printf '%s\n' "$web_log" | grep -F '"host":"localhost:8080"' | grep -qF '"uri":"/"'; then
            echo "Caddy did not log the host request to $HUB_URL/" >&2
            exit 1
          fi
          if sudo sh -c 'cat demo/.data/logs/butler-api-*.log' | grep -qF '"Path":"/health"'; then
            echo "the API logged a GET /health request line" >&2
            exit 1
          fi
          echo "health probes are not logged; other requests are"

      # AC7: the API created the tables on first boot, with no manual step.
      - name: Tables provisioned by the API on first boot
        run: docker compose -f "$COMPOSE_FILE_PATH" logs api | grep -E 'Provisioned [0-9]+ Table Storage tables'

      # AC5: the PWA build is served on host port 8080. #178: the served sw.js
      # carries the precache list build:web injects (12-hex build id, app shell,
      # an /_expo/**.js bundle), not just the marker, and the checker rejects
      # the placeholder worker a bare expo export copies from public/sw.js.
      # #259: only exit 1 with the rejection message counts as a rejection;
      # demo/ci/check-precache-exit.sh also checks that a usage error, a
      # missing file, a bad require or a crash exits 2 (or fails the guard)
      # instead.
      - name: Hub served on :8080
        run: |
          curl -fsS "$HUB_URL/" | grep -qi '<html'
          node demo/ci/check-precache.cjs "$HUB_URL/sw.js"
          bash demo/ci/check-precache-exit.sh
          curl -fsS "$HUB_URL/manifest.json" > /dev/null

      # #96: one origin on :8080 - SPA fallback, cache headers and the /api
      # proxy (prefix stripped), plus the /api base inlined into the bundle.
      - name: "Single origin: SPA fallback, cache headers, /api proxy"
        run: |
          hdr() { curl -fsS -D - -o /dev/null "$1" | tr -d '\r' | grep -i '^cache-control:'; }
          expect_cc() {
            got="$(hdr "$1" || true)"
            echo "$1 -> $got"
            if ! printf '%s' "$got" | grep -qiF "$2"; then
              echo "expected Cache-Control containing '$2' for $1, got '$got'" >&2
              exit 1
            fi
          }
          deep="$HUB_URL/households/demo/deep/link"
          # AC1: a path that is not a file falls back to index.html.
          curl -fsS "$deep" | grep -qi '<html'
          # AC2 + AC3: the service worker and the app shell are never cached stale.
          expect_cc "$HUB_URL/sw.js" 'no-cache'
          expect_cc "$HUB_URL/" 'no-cache'
          expect_cc "$HUB_URL/index.html" 'no-cache'
          expect_cc "$deep" 'no-cache'
          # AC4: content-hashed bundles are long-lived.
          bundle="$(cd Butler.UI/dist && ls _expo/static/js/web/*.js | head -n 1)"
          expect_cc "$HUB_URL/$bundle" 'max-age=31536000'
          # AC5: /api/* reaches the API with the prefix stripped.
          curl -fsS "$HUB_URL/api/health" | jq -e '.status == "ok"'
          curl -fsS -o /dev/null "$HUB_URL/api/api/system/ping"
          # #105: organizer calls carry a PIN-issued bearer, signed in through the proxy.
          token="$(curl -fsS -X POST "$HUB_URL/api/auth/pin/sign-in" -H 'Content-Type: application/json' \
            -d "{\"pin\":\"$BUTLER_DEMO_PIN\"}" | jq -er '.token')"
          id="$(curl -fsS -X POST "$HUB_URL/api/households" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Demo CI Proxy Household"}' | jq -er '.householdId')"
          echo "created household $id through the proxy"
          curl -fsS -H "Authorization: Bearer $token" "$HUB_URL/api/households/$id" | jq -e '.name == "Demo CI Proxy Household"'
          # The bundle was built with the relative /api base.
          if ! grep -rqF '"/api"' Butler.UI/dist/_expo/static/js/web/; then
            echo "hub bundle does not contain the /api base - was EXPO_PUBLIC_API_BASE_URL set?" >&2
            exit 1
          fi

      # AC6: the service worker registers and activates in desktop Chrome.
      # Playwright is installed outside the repo; it is not a UI dependency.
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.64.1

      - name: Service worker registers on :8080
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PW_CHANNEL: chrome
        run: node demo/ci/check-service-worker.cjs "$HUB_URL/"

      # #96 AC8: open the hub in Chrome, create a household through the
      # onboarding UI and let the hub read it back; every API call must go to
      # $HUB_URL/api/..., no request may leave the hub origin, and the console
      # must show zero CORS errors.
      - name: "Single origin: hub creates and reads back a household"
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PW_CHANNEL: chrome
        run: node demo/ci/check-household-flow.cjs "$HUB_URL/"

      # AC3: a household created before `down` is still there after `up`.
      - name: Household survives down/up
        run: |
          # #105: PIN tokens live in API memory, so sign in again after the restart.
          sign_in() {
            curl -fsS -X POST "$API_URL/auth/pin/sign-in" -H 'Content-Type: application/json' \
              -d "{\"pin\":\"$BUTLER_DEMO_PIN\"}" | jq -er '.token'
          }
          token="$(sign_in)"
          id="$(curl -fsS -X POST "$API_URL/households" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Demo CI Household"}' | jq -er '.householdId')"
          echo "created household $id"
          # No sleep: `down` sends SIGINT (stop_signal), so this proves Azurite's
          # shutdown save, not its 5s autosave.
          docker compose -f "$COMPOSE_FILE_PATH" down
          sudo grep -q "$id" demo/.data/azurite/__azurite_db_table__.json
          docker compose -f "$COMPOSE_FILE_PATH" up -d --wait --wait-timeout 240
          for i in $(seq 1 60); do
            curl -fs "$API_URL/health" > /dev/null && break
            if [ "$i" = 60 ]; then echo "API did not come back within 60s" >&2; exit 1; fi
            sleep 1
          done
          token="$(sign_in)"
          curl -fsS -H "Authorization: Bearer $token" "$API_URL/households/$id" | jq -e '.name == "Demo CI Household"'

      # #101 AC7: with share on (stub tailscale), and again after unshare,
      # Caddy still serves the hub, its service worker and the API on :8080.
      - name: "demo CLI: share keeps Caddy on :8080 (#101)"
        run: bash demo/ci/check-share.sh stack

      # #102 AC1-AC6, AC8: the demo CLI against the running stack. The export
      # is fresh here; EXPO_PUBLIC_API_BASE_URL and EXPO_PUBLIC_AUTH_PROVIDER
      # are deliberately not set, so the stale-export rebuild proves the script
      # sets them.
      - name: "demo CLI: status, logs, down, stale-export up"
        run: |
          # AC4 + AC5 + AC8: status from both scripts (direct call proves the
          # exec bit on demo.sh).
          sh_status="$(demo/demo.sh status)"
          ps_status="$(pwsh -NoProfile -File demo/demo.ps1 status)"
          printf '%s\n' "$sh_status"
          if [ "$sh_status" != "$ps_status" ]; then
            echo "demo.sh and demo.ps1 status output differ" >&2
            diff <(printf '%s\n' "$sh_status") <(printf '%s\n' "$ps_status") || true
            exit 1
          fi
          printf '%s\n' "$sh_status" | grep -qF 'http://localhost:8080'
          for svc in azurite api web; do
            printf '%s\n' "$sh_status" | grep -qE "^$svc +running +healthy$" || { echo "status does not show $svc running healthy" >&2; exit 1; }
          done
          printf '%s\n' "$sh_status" | grep -E '^Dataset: ' | grep -vqF 'unavailable' || { echo "status did not show a dataset id" >&2; exit 1; }

          # AC6: logs shows the compose services' logs.
          demo/demo.sh logs --api --no-color | grep -E 'Provisioned [0-9]+ Table Storage tables'

          # #107 AC6: plain `demo logs` follows the api and web (Caddy) logs
          # together: it is still running when timeout stops it (exit 124) and
          # has shown lines from both, including a Caddy access log.
          curl -fsS -o /dev/null "$HUB_URL/"
          curl -fsS -o /dev/null "$HUB_URL/api/health"
          set +e
          follow_out="$(timeout -k 5 15 demo/demo.sh logs 2>&1)"; follow_rc=$?
          set -e
          echo "demo logs exit=$follow_rc"
          printf '%s\n' "$follow_out" | tail -n 20
          [ "$follow_rc" -eq 124 ] || { echo "demo logs did not keep following (exit $follow_rc)" >&2; exit 1; }
          printf '%s\n' "$follow_out" | grep -qE 'api-1 +[|]' || { echo "demo logs showed no api lines" >&2; exit 1; }
          printf '%s\n' "$follow_out" | grep -qE 'web-1 +[|].*http[.]log[.]access' || { echo "demo logs showed no Caddy access log" >&2; exit 1; }

          # #107 AC7: `demo logs --api` shows only the API.
          api_out="$(demo/demo.sh logs --api --no-color --tail 200)"
          printf '%s\n' "$api_out" | grep -qE 'api-1 +[|]' || { echo "demo logs --api showed no api lines" >&2; exit 1; }
          if printf '%s\n' "$api_out" | grep -qE '(web|azurite)-1 +[|]'; then
            echo "demo logs --api showed lines from another service" >&2
            exit 1
          fi

          # AC3: down stops everything and keeps the Azurite data. Organizer
          # calls carry a PIN-issued bearer (#105), signed in again after each
          # restart because tokens live in API memory.
          sign_in() {
            curl -fsS -X POST "$API_URL/auth/pin/sign-in" -H 'Content-Type: application/json' \
              -d "{\"pin\":\"$BUTLER_DEMO_PIN\"}" | jq -er '.token'
          }
          token="$(sign_in)"
          id="$(curl -fsS -X POST "$API_URL/households" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Demo CLI Household"}' | jq -er '.householdId')"
          echo "created household $id"
          demo/demo.sh down
          if [ -n "$(docker compose -f "$COMPOSE_FILE_PATH" ps -aq)" ]; then
            echo "containers still exist after down" >&2
            exit 1
          fi
          sudo test -s demo/.data/azurite/__azurite_db_table__.json

          # AC1 + AC2: a stale export is rebuilt, and up returns only once
          # every service is healthy.
          touch Butler.UI/app.json
          out="$(demo/demo.sh up)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qF 'Hub export is older than its sources'
          if printf '%s\n' "$out" | grep -qF 'The API file log is off'; then
            echo "up warned that the API file log is off, but demo/.data/logs is writable (#193)" >&2
            exit 1
          fi
          printf '%s\n' "$out" | grep -qxF 'Demo stack is up and healthy: http://localhost:8080'
          # #103 AC1-AC5 + AC8b: up then ran the real smoke suite through the
          # proxy: the two Liveness checks and #92's six Rooms round trips
          # (signed in with the PIN, Rooms rows read on 127.0.0.1:10012), never
          # the Demo, Storage or Provisioning tests, and ended ready.
          printf '%s\n' "$out" | grep -qxF 'Running the smoke suite against http://localhost:8080/api/ ...'
          for t in \
            LivenessSmokeTests.Get_health_returns_200_with_status_ok \
            LivenessSmokeTests.Get_ping_returns_200_with_service_identity \
            RoomsHttpRoundTripSmokeTests.Post_room_returns_201_and_persists_it_to_table_storage \
            RoomsHttpRoundTripSmokeTests.Get_room_returns_200_with_its_etag \
            RoomsHttpRoundTripSmokeTests.Put_room_with_current_etag_returns_200_and_get_returns_new_values \
            RoomsHttpRoundTripSmokeTests.Put_room_without_if_match_returns_428 \
            RoomsHttpRoundTripSmokeTests.Put_room_with_stale_etag_returns_412 \
            RoomsHttpRoundTripSmokeTests.Delete_room_returns_204_and_removes_it_from_table_storage; do
            printf '%s\n' "$out" | grep -qE "^[[:space:]]*Passed Butler\.Api\.SmokeTests\.$t \[" || { echo "demo up did not pass smoke test $t" >&2; exit 1; }
          done
          if printf '%s\n' "$out" | grep -E '(DemoSeed|StorageRoundTrip|TableProvisioning|TableReprovisioning)SmokeTests\.|SmokeSettingsTests\.'; then
            echo "demo up ran a smoke test outside the Liveness and Endpoints categories" >&2
            exit 1
          fi
          [ "$(printf '%s\n' "$out" | tail -n 1)" = 'Demo ready: hub http://localhost:8080 | API http://localhost:8080/api/health | Swagger http://localhost:5108/swagger' ]
          grep -rqF '"/api"' Butler.UI/dist/_expo/static/js/web/ || { echo "rebuilt bundle lacks the /api base" >&2; exit 1; }
          # #184: the rebuild wrote up's build stamp, byte for byte.
          printf 'EXPO_PUBLIC_API_BASE_URL=/api\nEXPO_PUBLIC_AUTH_PROVIDER=pin\n' | cmp - Butler.UI/dist/.demo-build-env
          # #105: the rebuilt hub still offers the PIN pad (the script set the provider).
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" PW_CHANNEL=chrome node demo/ci/check-household-flow.cjs "$HUB_URL/"
          health="$(docker compose -f "$COMPOSE_FILE_PATH" ps --format '{{.Service}} {{.Health}}')"
          echo "$health"
          [ "$(printf '%s\n' "$health" | grep -c ' healthy$')" -eq 3 ] || { echo "not every service is healthy right after up" >&2; exit 1; }
          curl -fsS "$HUB_URL/" | grep -qi '<html'
          token="$(sign_in)"
          curl -fsS -H "Authorization: Bearer $token" "$API_URL/households/$id" | jq -e '.name == "Demo CLI Household"'

          # AC1: an up-to-date export is not rebuilt.
          out="$(demo/demo.sh up)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qxF 'Hub export is up to date (Butler.UI/dist).'
          if printf '%s\n' "$out" | grep -qF 'The API file log is off'; then
            echo "up warned that the API file log is off, but demo/.data/logs is writable (#193)" >&2
            exit 1
          fi

      # #102 AC1 + AC8: demo.ps1 runs logs, up and down too, with the same
      # output as demo.sh, and both rebuild a missing hub export. docker and
      # npm output passes through untouched (build steps and digests differ
      # run to run), so for `up` only the lines the scripts write themselves
      # are compared; logs and down are compared in full. Starts with the
      # stack up and the export fresh (previous step).
      - name: "demo CLI: demo.ps1 logs/up/down parity, missing-export up"
        run: |
          ps1() { pwsh -NoProfile -File demo/demo.ps1 "$@"; }
          # The fixed lines both scripts print for up (and down).
          own() {
            grep -xF \
              -e 'Hub export is up to date (Butler.UI/dist).' \
              -e 'Hub export is missing; building Butler.UI/dist ...' \
              -e 'Hub export is older than its sources; building Butler.UI/dist ...' \
              -e 'Hub export was not built with the demo settings; building Butler.UI/dist ...' \
              -e 'Installing Butler.UI dependencies (npm ci) ...' \
              -e 'Starting the demo stack ...' \
              -e 'Recreating web to serve the new export ...' \
              -e 'Demo stack is up and healthy: http://localhost:8080' \
              -e 'Demo stack did not become healthy. Run the logs command to see why.' \
              -e 'Running the smoke suite against http://localhost:8080/api/ ...' \
              -e 'Demo ready: hub http://localhost:8080 | API http://localhost:8080/api/health | Swagger http://localhost:5108/swagger' \
              -e 'Demo is not ready: the smoke suite failed. Run the logs command to see why.' \
              -e 'Stopping the demo stack (data in demo/.data/azurite is kept) ...' \
              -e 'Demo stack stopped.' || true
          }
          same() {
            if [ "$2" != "$3" ]; then
              echo "demo.sh and demo.ps1 differ for '$1'" >&2
              diff <(printf '%s\n' "$2") <(printf '%s\n' "$3") || true
              exit 1
            fi
          }
          expect() {
            if [ "$2" != "$3" ]; then
              echo "unexpected output for '$1'" >&2
              diff <(printf '%s\n' "$3") <(printf '%s\n' "$2") || true
              exit 1
            fi
          }
          all_healthy() {
            health="$(docker compose -f "$COMPOSE_FILE_PATH" ps --format '{{.Service}} {{.Health}}')"
            echo "$health"
            [ "$(printf '%s\n' "$health" | grep -c ' healthy$')" -eq 3 ] || { echo "not every service is healthy right after up" >&2; exit 1; }
          }

          # AC8 logs: both pass extra arguments through and print the same
          # logs. --until pins the window so new request logs cannot differ.
          until="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 2
          sh_logs="$(demo/demo.sh logs --api --no-color --until "$until")"
          ps_logs="$(ps1 logs --api --no-color --until "$until")"
          same "logs --api --no-color --until $until" "$sh_logs" "$ps_logs"
          printf '%s\n' "$ps_logs" | grep -E 'Provisioned [0-9]+ Table Storage tables'

          # #190 AC1 + AC4: naming a service shows only that service, and
          # both scripts print the same logs.
          sh_az="$(demo/demo.sh logs --no-color --until "$until" azurite)"
          ps_az="$(ps1 logs --no-color --until "$until" azurite)"
          same "logs --no-color --until $until azurite" "$sh_az" "$ps_az"
          printf '%s\n' "$ps_az" | grep -qE 'azurite-1 +[|]' || { echo "demo logs azurite showed no azurite lines" >&2; exit 1; }
          if printf '%s\n' "$ps_az" | grep -qE '(api|web)-1 +[|]'; then
            echo "demo logs azurite showed lines from another service" >&2
            exit 1
          fi

          # AC8 up, export fresh: same lines, no rebuild.
          fresh_up="$(printf '%s\n' \
            'Hub export is up to date (Butler.UI/dist).' \
            'Starting the demo stack ...' \
            'Demo stack is up and healthy: http://localhost:8080' \
            'Running the smoke suite against http://localhost:8080/api/ ...' \
            'Demo ready: hub http://localhost:8080 | API http://localhost:8080/api/health | Swagger http://localhost:5108/swagger')"
          sh_out="$(demo/demo.sh up)"
          ps_out="$(ps1 up)"
          same "up (fresh)" "$(printf '%s\n' "$sh_out" | own)" "$(printf '%s\n' "$ps_out" | own)"
          expect "up (fresh)" "$(printf '%s\n' "$ps_out" | own)" "$fresh_up"

          # AC8 down: identical output, nothing left running, data kept.
          down_out="$(printf '%s\n' \
            'Stopping the demo stack (data in demo/.data/azurite is kept) ...' \
            'Demo stack stopped.')"
          ps_down="$(ps1 down)"
          expect "down (demo.ps1)" "$ps_down" "$down_out"
          [ -z "$(docker compose -f "$COMPOSE_FILE_PATH" ps -aq)" ] || { echo "containers still exist after demo.ps1 down" >&2; exit 1; }
          sudo test -s demo/.data/azurite/__azurite_db_table__.json

          # AC1 missing: with no Butler.UI/dist, demo.ps1 up builds the export
          # (with the /api base) before the stack starts, and returns healthy.
          missing_up="$(printf '%s\n' \
            'Hub export is missing; building Butler.UI/dist ...' \
            'Starting the demo stack ...' \
            'Recreating web to serve the new export ...' \
            'Demo stack is up and healthy: http://localhost:8080' \
            'Running the smoke suite against http://localhost:8080/api/ ...' \
            'Demo ready: hub http://localhost:8080 | API http://localhost:8080/api/health | Swagger http://localhost:5108/swagger')"
          rm -rf Butler.UI/dist
          ps_out="$(ps1 up)"
          printf '%s\n' "$ps_out" | own
          expect "up (missing, demo.ps1)" "$(printf '%s\n' "$ps_out" | own)" "$missing_up"
          test -f Butler.UI/dist/index.html
          grep -rqF '"/api"' Butler.UI/dist/_expo/static/js/web/ || { echo "rebuilt bundle lacks the /api base" >&2; exit 1; }
          all_healthy
          curl -fsS "$HUB_URL/" | grep -qi '<html'

          # Same again through demo.sh: down matches demo.ps1's down, and a
          # missing export is rebuilt with the same lines.
          sh_down="$(demo/demo.sh down)"
          same "down" "$sh_down" "$ps_down"
          rm -rf Butler.UI/dist
          sh_out="$(demo/demo.sh up)"
          same "up (missing)" "$(printf '%s\n' "$sh_out" | own)" "$(printf '%s\n' "$ps_out" | own)"
          test -f Butler.UI/dist/index.html
          grep -rqF '"/api"' Butler.UI/dist/_expo/static/js/web/ || { echo "rebuilt bundle lacks the /api base" >&2; exit 1; }
          all_healthy
          curl -fsS "$HUB_URL/" | grep -qi '<html'

      # #98 AC1-AC6 + AC8b: demo.sh reset and demo.ps1 reset (stdin closed)
      # each wipe the demo data, sign in with the PIN, re-seed The Parker
      # Household and change the dataset id, with the same own lines; a reset
      # from a stopped stack works too. Starts with the stack up.
      - name: "demo CLI: reset wipes and re-seeds the demo (#98)"
        run: bash demo/ci/check-reset.sh stack

      # On failure, surface what each service logged so the cause is visible
      # without rerunning.
      - name: Dump stack logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE_PATH" ps -a || true
          for svc in azurite api web; do
            echo "::group::$svc"
            docker compose -f "$COMPOSE_FILE_PATH" logs --no-color "$svc" || true
            echo "::endgroup::"
          done

      - name: Stop the stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE_PATH" down || true
