# CI gate for the local Docker Compose demo stack (demo/, issue #94).
#
# Path-filtered: this runs only when a change touches demo/** (or this workflow
# file itself), so API- and UI-only PRs never pay for it (see api-ci.yml and
# ui-ci.yml).
#
# Two jobs:
#   config - static checks: the compose file is valid (`docker compose config`
#            exits 0), Azurite is pinned with its data bind-mounted to
#            demo/.data/azurite, the API gets an explicit TableEndpoint
#            connection string, demo/ creates no tables, demo/.data is
#            git-ignored, and demo/README.md documents the commands. Also the
#            demo CLI (#102): demo.sh and demo.ps1 parse, print the same usage
#            and exit non-zero for no/unknown subcommands, every subcommand is
#            in demo/README.md, and they drive the single compose file. And
#            share/unshare (#101) against a stub tailscale through both
#            scripts (demo/ci/check-share.sh static), run once with the npx
#            qrcode-terminal QR fallback and once with qrencode installed.
#            And the API's log folder (#107) is bind-mounted from
#            demo/.data/logs to /app/logs.
#   stack  - boots the real stack (Azurite + API + Caddy), checks the hub and
#            its service worker on :8080, the single origin (SPA fallback, cache
#            headers, /api proxy, #96), a household created and read back
#            through the hub UI with every API call same-origin (#96), the
#            API's table provisioning, and that a household survives `down` +
#            `up`. Then runs the demo CLI against it (#102): status, logs,
#            up and down through both demo.sh and demo.ps1 with the same
#            output, down keeping the data, and up rebuilding a missing or
#            stale hub export and waiting for every service to be healthy.
#            Also checks that Caddy keeps serving :8080 while share is on and
#            after unshare (#101, demo/ci/check-share.sh stack). And the Demo
#            request log (#107): a 404's traceId appears as the CorrelationId
#            in demo/.data/logs, `demo logs` follows api and web together, and
#            `demo logs --api` shows only the API.
name: demo-ci

on:
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/demo-ci.yml"
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/demo-ci.yml"

# Least privilege: both jobs only read the checked-out source.
permissions:
  contents: read

# Supersede in-flight runs for the same ref so a new push cancels stale work.
concurrency:
  group: demo-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE_PATH: demo/docker-compose.yml

jobs:
  config:
    name: compose config + static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AC10: the compose file parses and resolves (exit code 0).
      - name: Validate compose file
        run: docker compose -f "$COMPOSE_FILE_PATH" config --quiet

      # Render once so the following greps check the resolved config (absolute
      # bind sources, interpolated values) rather than the raw source text.
      - name: Render compose config
        run: docker compose -f "$COMPOSE_FILE_PATH" config > "$RUNNER_TEMP/compose.yml"

      # AC2: official Azurite image at a pinned tag, data bind-mounted to
      # demo/.data/azurite.
      - name: Assert pinned Azurite image and bind mount
        run: |
          grep -E '^\s+image: mcr\.microsoft\.com/azure-storage/azurite:[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/compose.yml"
          grep -E 'source: .*/demo/\.data/azurite$' "$RUNNER_TEMP/compose.yml"

      # #107 AC1: the API's rolling log files land in demo/.data/logs (mounted
      # at /app/logs, where DemoLogging:DirectoryPath "logs" resolves).
      - name: Assert API log folder bind mount
        run: |
          grep -E 'source: .*/demo/\.data/logs$' "$RUNNER_TEMP/compose.yml"
          grep -E 'target: /app/logs$' "$RUNNER_TEMP/compose.yml"
          git check-ignore -q demo/.data/logs/probe

      # AC4: explicit connection string to the azurite service, never the
      # UseDevelopmentStorage shortcut (which resolves to the api container).
      - name: Assert explicit TableEndpoint connection string
        run: |
          grep -F 'TableEndpoint=http://azurite:10002/devstoreaccount1' "$RUNNER_TEMP/compose.yml"
          if grep -n 'UseDevelopmentStorage' "$RUNNER_TEMP/compose.yml"; then
            echo "demo compose must not use UseDevelopmentStorage=true" >&2
            exit 1
          fi

      # AC7: tables come from the API's startup provisioning (#91), not demo/.
      - name: Assert no table creation in demo/
        run: |
          if grep -rnE 'CreateIfNotExists|CreateTable|az storage table create' demo/; then
            echo "demo/ must not create tables - the API provisions them (#91)" >&2
            exit 1
          fi

      # AC9: the Azurite data folder is git-ignored.
      - name: Assert demo/.data is git-ignored
        run: git check-ignore -q demo/.data/azurite/probe

      # AC8: prerequisites and the up/down commands are documented.
      - name: Assert demo README documents prerequisites and commands
        run: |
          grep -F 'Docker Desktop' demo/README.md
          grep -F 'docker compose -f demo/docker-compose.yml up -d' demo/README.md
          grep -F 'docker compose -f demo/docker-compose.yml down' demo/README.md
          # #96: the /api build and the doubled system prefix are documented.
          grep -F 'EXPO_PUBLIC_API_BASE_URL=/api' demo/README.md
          grep -F '/api/api/system/ping' demo/README.md
          # #101 AC8: the tablet section covers Tailscale, a local CA and adb reverse.
          grep -F '## Connecting a tablet' demo/README.md
          grep -F 'tailscale serve --bg 8080' demo/README.md
          grep -F 'mkcert' demo/README.md
          grep -F 'adb reverse tcp:8080 tcp:8080' demo/README.md

      # #102 AC7-AC11: the demo CLI scripts. pwsh is preinstalled on
      # ubuntu-latest. No stack is needed: usage is printed before docker is
      # touched.
      - name: "demo CLI: usage, unknown subcommand, parity, README"
        run: |
          bash -n demo/demo.sh
          pwsh -NoProfile -Command '$t = $null; $e = $null; $null = [System.Management.Automation.Language.Parser]::ParseFile("demo/demo.ps1", [ref]$t, [ref]$e); if ($e) { $e; exit 1 }'
          # AC7 + AC8: no subcommand and an unknown one both print the command
          # list and exit non-zero, with identical output from both scripts.
          for args in "" "bogus"; do
            set +e
            # shellcheck disable=SC2086 - an empty $args must expand to nothing.
            sh_out="$(bash demo/demo.sh $args 2>&1)"; sh_rc=$?
            # shellcheck disable=SC2086
            ps_out="$(pwsh -NoProfile -File demo/demo.ps1 $args 2>&1)"; ps_rc=$?
            set -e
            echo "args='$args' demo.sh exit=$sh_rc demo.ps1 exit=$ps_rc"
            printf '%s\n' "$sh_out"
            if [ "$sh_rc" -eq 0 ] || [ "$ps_rc" -eq 0 ]; then
              echo "expected a non-zero exit for args='$args'" >&2
              exit 1
            fi
            if [ "$sh_rc" -ne "$ps_rc" ]; then
              echo "exit codes differ for args='$args'" >&2
              exit 1
            fi
            if [ "$sh_out" != "$ps_out" ]; then
              echo "demo.sh and demo.ps1 print different output for args='$args'" >&2
              diff <(printf '%s\n' "$sh_out") <(printf '%s\n' "$ps_out") || true
              exit 1
            fi
            for cmd in up down status logs share unshare; do
              printf '%s\n' "$sh_out" | grep -qE "^  $cmd " || { echo "usage does not list '$cmd'" >&2; exit 1; }
            done
          done
          # AC10: every subcommand in the usage is documented in demo/README.md.
          set +e
          names="$(bash demo/demo.sh 2>&1 | awk '/^  [a-z]/{print $1}')"
          set -e
          count="$(printf '%s\n' "$names" | grep -c . || true)"
          if [ "$count" -lt 6 ]; then
            echo "expected at least 6 subcommands in the usage, parsed $count" >&2
            exit 1
          fi
          for name in $names; do
            grep -qF "demo.sh $name" demo/README.md || { echo "demo/README.md does not document 'demo.sh $name'" >&2; exit 1; }
          done
          # AC9: one compose file in the repo, and both scripts drive it.
          compose_files="$(git ls-files '*compose*.yml' '*compose*.yaml')"
          echo "compose files: $compose_files"
          [ "$(printf '%s\n' "$compose_files" | grep -c .)" -eq 1 ]
          grep -qF 'docker-compose.yml' demo/demo.sh
          grep -qF 'docker-compose.yml' demo/demo.ps1
          # AC11: the API README separates the API-only loop from the demo.
          grep -F 'API-only dev loop' Butler.API/README.md
          grep -F 'demo/demo.sh' Butler.API/README.md

      # #101: share/unshare against a stub tailscale, through both scripts.
      # Node provides npx for the qrcode-terminal QR fallback.
      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # #101 AC1-AC6: no qrencode yet, so the QR code comes from npx
      # qrcode-terminal.
      - name: "demo CLI: share/unshare (npx QR fallback)"
        run: bash demo/ci/check-share.sh static

      - name: Install qrencode
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qrencode

      # #101 AC5: with qrencode on PATH, the QR code is its ansiutf8 output.
      - name: "demo CLI: share/unshare (qrencode)"
        run: bash demo/ci/check-share.sh static

  stack:
    name: stack (Azurite + API + Caddy)
    needs: config
    runs-on: ubuntu-latest
    env:
      API_URL: http://127.0.0.1:5108
      HUB_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      # Same Node pin and npm cache as ui-ci.yml.
      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Butler.UI/package-lock.json

      # The web service serves the host-built export; build:web (not a bare
      # expo export) also injects the precache list into dist/sw.js. The /api
      # base is inlined at bundle time so the hub calls the API same-origin.
      - name: Build the hub export
        working-directory: Butler.UI
        env:
          EXPO_PUBLIC_API_BASE_URL: /api
        run: |
          npm ci
          npm run build:web

      # AC1: all three services come up and stay running. The API runs as a
      # non-root user, so its log folder is created writable first (#107), as
      # demo up does.
      - name: Start the stack
        run: |
          mkdir -p demo/.data/logs
          chmod 777 demo/.data/logs
          docker compose -f "$COMPOSE_FILE_PATH" up -d --build --wait --wait-timeout 240
          running="$(docker compose -f "$COMPOSE_FILE_PATH" ps --services --status running | sort | tr '\n' ' ')"
          echo "running: $running"
          if [ "$running" != "api azurite web " ]; then
            echo "expected services 'api azurite web ' to be running, got '$running'" >&2
            exit 1
          fi

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fs "$API_URL/health" > /dev/null; then
              echo "API is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy within 60s" >&2
          exit 1

      # #107 AC1 + AC5: a request writes a structured line to the rolling file
      # in demo/.data/logs, and the RFC 7807 traceId of an error response is
      # that line's CorrelationId. The line is written after the response, so
      # allow a few seconds for it to land.
      - name: "API writes request logs to demo/.data/logs (#107)"
        run: |
          body="$(curl -sS "$API_URL/households/ci-log-probe")"
          echo "$body"
          trace="$(printf '%s' "$body" | jq -er '.traceId')"
          echo "traceId: $trace"
          for i in $(seq 1 10); do
            line="$(sudo sh -c 'cat demo/.data/logs/butler-api-*.log' 2>/dev/null | grep -F "\"CorrelationId\":\"$trace\"" || true)"
            [ -n "$line" ] && break
            sleep 0.5
          done
          ls -l demo/.data/logs
          if [ -z "$line" ]; then
            echo "no log line with CorrelationId $trace in demo/.data/logs" >&2
            exit 1
          fi
          echo "$line"
          printf '%s\n' "$line" | grep -qF '"HouseholdId":"ci-log-probe"'
          printf '%s\n' "$line" | grep -qF '"StatusCode":404'
          printf '%s\n' "$line" | grep -qF '"Path":"/households/ci-log-probe"'
          printf '%s\n' "$line" | grep -qE '"ElapsedMs":[0-9.]+'

      # AC7: the API created the tables on first boot, with no manual step.
      - name: Tables provisioned by the API on first boot
        run: docker compose -f "$COMPOSE_FILE_PATH" logs api | grep -E 'Provisioned [0-9]+ Table Storage tables'

      # AC5: the PWA build is served on host port 8080.
      - name: Hub served on :8080
        run: |
          curl -fsS "$HUB_URL/" | grep -qi '<html'
          curl -fsS "$HUB_URL/sw.js" | grep -qF 'butler-precache:begin'
          curl -fsS "$HUB_URL/manifest.json" > /dev/null

      # #96: one origin on :8080 - SPA fallback, cache headers and the /api
      # proxy (prefix stripped), plus the /api base inlined into the bundle.
      - name: "Single origin: SPA fallback, cache headers, /api proxy"
        run: |
          hdr() { curl -fsS -D - -o /dev/null "$1" | tr -d '\r' | grep -i '^cache-control:'; }
          expect_cc() {
            got="$(hdr "$1" || true)"
            echo "$1 -> $got"
            if ! printf '%s' "$got" | grep -qiF "$2"; then
              echo "expected Cache-Control containing '$2' for $1, got '$got'" >&2
              exit 1
            fi
          }
          deep="$HUB_URL/households/demo/deep/link"
          # AC1: a path that is not a file falls back to index.html.
          curl -fsS "$deep" | grep -qi '<html'
          # AC2 + AC3: the service worker and the app shell are never cached stale.
          expect_cc "$HUB_URL/sw.js" 'no-cache'
          expect_cc "$HUB_URL/" 'no-cache'
          expect_cc "$HUB_URL/index.html" 'no-cache'
          expect_cc "$deep" 'no-cache'
          # AC4: content-hashed bundles are long-lived.
          bundle="$(cd Butler.UI/dist && ls _expo/static/js/web/*.js | head -n 1)"
          expect_cc "$HUB_URL/$bundle" 'max-age=31536000'
          # AC5: /api/* reaches the API with the prefix stripped.
          curl -fsS "$HUB_URL/api/health" | jq -e '.status == "ok"'
          curl -fsS -o /dev/null "$HUB_URL/api/api/system/ping"
          id="$(curl -fsS -X POST "$HUB_URL/api/households" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Demo CI Proxy Household"}' | jq -er '.householdId')"
          echo "created household $id through the proxy"
          curl -fsS "$HUB_URL/api/households/$id" | jq -e '.name == "Demo CI Proxy Household"'
          # The bundle was built with the relative /api base.
          if ! grep -rqF '"/api"' Butler.UI/dist/_expo/static/js/web/; then
            echo "hub bundle does not contain the /api base - was EXPO_PUBLIC_API_BASE_URL set?" >&2
            exit 1
          fi

      # AC6: the service worker registers and activates in desktop Chrome.
      # Playwright is installed outside the repo; it is not a UI dependency.
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.64.1

      - name: Service worker registers on :8080
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PW_CHANNEL: chrome
        run: node demo/ci/check-service-worker.cjs "$HUB_URL/"

      # #96 AC8: open the hub in Chrome, create a household through the
      # onboarding UI and let the hub read it back; every API call must go to
      # $HUB_URL/api/..., no request may leave the hub origin, and the console
      # must show zero CORS errors.
      - name: "Single origin: hub creates and reads back a household"
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PW_CHANNEL: chrome
        run: node demo/ci/check-household-flow.cjs "$HUB_URL/"

      # AC3: a household created before `down` is still there after `up`.
      - name: Household survives down/up
        run: |
          id="$(curl -fsS -X POST "$API_URL/households" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Demo CI Household"}' | jq -er '.householdId')"
          echo "created household $id"
          # No sleep: `down` sends SIGINT (stop_signal), so this proves Azurite's
          # shutdown save, not its 5s autosave.
          docker compose -f "$COMPOSE_FILE_PATH" down
          sudo grep -q "$id" demo/.data/azurite/__azurite_db_table__.json
          docker compose -f "$COMPOSE_FILE_PATH" up -d --wait --wait-timeout 240
          for i in $(seq 1 60); do
            curl -fs "$API_URL/health" > /dev/null && break
            if [ "$i" = 60 ]; then echo "API did not come back within 60s" >&2; exit 1; fi
            sleep 1
          done
          curl -fsS "$API_URL/households/$id" | jq -e '.name == "Demo CI Household"'

      # #101 AC7: with share on (stub tailscale), and again after unshare,
      # Caddy still serves the hub, its service worker and the API on :8080.
      - name: "demo CLI: share keeps Caddy on :8080 (#101)"
        run: bash demo/ci/check-share.sh stack

      # #102 AC1-AC6, AC8: the demo CLI against the running stack. The export
      # is fresh here; EXPO_PUBLIC_API_BASE_URL is deliberately not set, so the
      # stale-export rebuild proves the script sets it.
      - name: "demo CLI: status, logs, down, stale-export up"
        run: |
          # AC4 + AC5 + AC8: status from both scripts (direct call proves the
          # exec bit on demo.sh).
          sh_status="$(demo/demo.sh status)"
          ps_status="$(pwsh -NoProfile -File demo/demo.ps1 status)"
          printf '%s\n' "$sh_status"
          if [ "$sh_status" != "$ps_status" ]; then
            echo "demo.sh and demo.ps1 status output differ" >&2
            diff <(printf '%s\n' "$sh_status") <(printf '%s\n' "$ps_status") || true
            exit 1
          fi
          printf '%s\n' "$sh_status" | grep -qF 'http://localhost:8080'
          for svc in azurite api web; do
            printf '%s\n' "$sh_status" | grep -qE "^$svc +running +healthy$" || { echo "status does not show $svc running healthy" >&2; exit 1; }
          done
          printf '%s\n' "$sh_status" | grep -E '^Dataset: ' | grep -vqF 'unavailable' || { echo "status did not show a dataset id" >&2; exit 1; }

          # AC6: logs shows the compose services' logs.
          demo/demo.sh logs --api --no-color | grep -E 'Provisioned [0-9]+ Table Storage tables'

          # #107 AC6: plain `demo logs` follows the api and web (Caddy) logs
          # together: it is still running when timeout stops it (exit 124) and
          # has shown lines from both, including a Caddy access log.
          curl -fsS -o /dev/null "$HUB_URL/"
          curl -fsS -o /dev/null "$HUB_URL/api/health"
          set +e
          follow_out="$(timeout -k 5 15 demo/demo.sh logs 2>&1)"; follow_rc=$?
          set -e
          echo "demo logs exit=$follow_rc"
          printf '%s\n' "$follow_out" | tail -n 20
          [ "$follow_rc" -eq 124 ] || { echo "demo logs did not keep following (exit $follow_rc)" >&2; exit 1; }
          printf '%s\n' "$follow_out" | grep -qE 'api-1 +[|]' || { echo "demo logs showed no api lines" >&2; exit 1; }
          printf '%s\n' "$follow_out" | grep -qE 'web-1 +[|].*http[.]log[.]access' || { echo "demo logs showed no Caddy access log" >&2; exit 1; }

          # #107 AC7: `demo logs --api` shows only the API.
          api_out="$(demo/demo.sh logs --api --no-color --tail 200)"
          printf '%s\n' "$api_out" | grep -qE 'api-1 +[|]' || { echo "demo logs --api showed no api lines" >&2; exit 1; }
          if printf '%s\n' "$api_out" | grep -qE '(web|azurite)-1 +[|]'; then
            echo "demo logs --api showed lines from another service" >&2
            exit 1
          fi

          # AC3: down stops everything and keeps the Azurite data.
          id="$(curl -fsS -X POST "$API_URL/households" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Demo CLI Household"}' | jq -er '.householdId')"
          echo "created household $id"
          demo/demo.sh down
          if [ -n "$(docker compose -f "$COMPOSE_FILE_PATH" ps -aq)" ]; then
            echo "containers still exist after down" >&2
            exit 1
          fi
          sudo test -s demo/.data/azurite/__azurite_db_table__.json

          # AC1 + AC2: a stale export is rebuilt, and up returns only once
          # every service is healthy.
          touch Butler.UI/app.json
          out="$(demo/demo.sh up)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qF 'Hub export is older than its sources'
          [ "$(printf '%s\n' "$out" | tail -n 1)" = 'Demo stack is up and healthy: http://localhost:8080' ]
          grep -rqF '"/api"' Butler.UI/dist/_expo/static/js/web/ || { echo "rebuilt bundle lacks the /api base" >&2; exit 1; }
          health="$(docker compose -f "$COMPOSE_FILE_PATH" ps --format '{{.Service}} {{.Health}}')"
          echo "$health"
          [ "$(printf '%s\n' "$health" | grep -c ' healthy$')" -eq 3 ] || { echo "not every service is healthy right after up" >&2; exit 1; }
          curl -fsS "$HUB_URL/" | grep -qi '<html'
          curl -fsS "$API_URL/households/$id" | jq -e '.name == "Demo CLI Household"'

          # AC1: an up-to-date export is not rebuilt.
          out="$(demo/demo.sh up)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qxF 'Hub export is up to date (Butler.UI/dist).'

      # #102 AC1 + AC8: demo.ps1 runs logs, up and down too, with the same
      # output as demo.sh, and both rebuild a missing hub export. docker and
      # npm output passes through untouched (build steps and digests differ
      # run to run), so for `up` only the lines the scripts write themselves
      # are compared; logs and down are compared in full. Starts with the
      # stack up and the export fresh (previous step).
      - name: "demo CLI: demo.ps1 logs/up/down parity, missing-export up"
        run: |
          ps1() { pwsh -NoProfile -File demo/demo.ps1 "$@"; }
          # The fixed lines both scripts print for up (and down).
          own() {
            grep -xF \
              -e 'Hub export is up to date (Butler.UI/dist).' \
              -e 'Hub export is missing; building Butler.UI/dist ...' \
              -e 'Hub export is older than its sources; building Butler.UI/dist ...' \
              -e 'Installing Butler.UI dependencies (npm ci) ...' \
              -e 'Starting the demo stack ...' \
              -e 'Recreating web to serve the new export ...' \
              -e 'Demo stack is up and healthy: http://localhost:8080' \
              -e 'Demo stack did not become healthy. Run the logs command to see why.' \
              -e 'Stopping the demo stack (data in demo/.data/azurite is kept) ...' \
              -e 'Demo stack stopped.' || true
          }
          same() {
            if [ "$2" != "$3" ]; then
              echo "demo.sh and demo.ps1 differ for '$1'" >&2
              diff <(printf '%s\n' "$2") <(printf '%s\n' "$3") || true
              exit 1
            fi
          }
          expect() {
            if [ "$2" != "$3" ]; then
              echo "unexpected output for '$1'" >&2
              diff <(printf '%s\n' "$3") <(printf '%s\n' "$2") || true
              exit 1
            fi
          }
          all_healthy() {
            health="$(docker compose -f "$COMPOSE_FILE_PATH" ps --format '{{.Service}} {{.Health}}')"
            echo "$health"
            [ "$(printf '%s\n' "$health" | grep -c ' healthy$')" -eq 3 ] || { echo "not every service is healthy right after up" >&2; exit 1; }
          }

          # AC8 logs: both pass extra arguments through and print the same
          # logs. --until pins the window so new request logs cannot differ.
          until="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 2
          sh_logs="$(demo/demo.sh logs --api --no-color --until "$until")"
          ps_logs="$(ps1 logs --api --no-color --until "$until")"
          same "logs --api --no-color --until $until" "$sh_logs" "$ps_logs"
          printf '%s\n' "$ps_logs" | grep -E 'Provisioned [0-9]+ Table Storage tables'

          # AC8 up, export fresh: same lines, no rebuild.
          fresh_up="$(printf '%s\n' \
            'Hub export is up to date (Butler.UI/dist).' \
            'Starting the demo stack ...' \
            'Demo stack is up and healthy: http://localhost:8080')"
          sh_out="$(demo/demo.sh up)"
          ps_out="$(ps1 up)"
          same "up (fresh)" "$(printf '%s\n' "$sh_out" | own)" "$(printf '%s\n' "$ps_out" | own)"
          expect "up (fresh)" "$(printf '%s\n' "$ps_out" | own)" "$fresh_up"

          # AC8 down: identical output, nothing left running, data kept.
          down_out="$(printf '%s\n' \
            'Stopping the demo stack (data in demo/.data/azurite is kept) ...' \
            'Demo stack stopped.')"
          ps_down="$(ps1 down)"
          expect "down (demo.ps1)" "$ps_down" "$down_out"
          [ -z "$(docker compose -f "$COMPOSE_FILE_PATH" ps -aq)" ] || { echo "containers still exist after demo.ps1 down" >&2; exit 1; }
          sudo test -s demo/.data/azurite/__azurite_db_table__.json

          # AC1 missing: with no Butler.UI/dist, demo.ps1 up builds the export
          # (with the /api base) before the stack starts, and returns healthy.
          missing_up="$(printf '%s\n' \
            'Hub export is missing; building Butler.UI/dist ...' \
            'Starting the demo stack ...' \
            'Recreating web to serve the new export ...' \
            'Demo stack is up and healthy: http://localhost:8080')"
          rm -rf Butler.UI/dist
          ps_out="$(ps1 up)"
          printf '%s\n' "$ps_out" | own
          expect "up (missing, demo.ps1)" "$(printf '%s\n' "$ps_out" | own)" "$missing_up"
          test -f Butler.UI/dist/index.html
          grep -rqF '"/api"' Butler.UI/dist/_expo/static/js/web/ || { echo "rebuilt bundle lacks the /api base" >&2; exit 1; }
          all_healthy
          curl -fsS "$HUB_URL/" | grep -qi '<html'

          # Same again through demo.sh: down matches demo.ps1's down, and a
          # missing export is rebuilt with the same lines.
          sh_down="$(demo/demo.sh down)"
          same "down" "$sh_down" "$ps_down"
          rm -rf Butler.UI/dist
          sh_out="$(demo/demo.sh up)"
          same "up (missing)" "$(printf '%s\n' "$sh_out" | own)" "$(printf '%s\n' "$ps_out" | own)"
          test -f Butler.UI/dist/index.html
          grep -rqF '"/api"' Butler.UI/dist/_expo/static/js/web/ || { echo "rebuilt bundle lacks the /api base" >&2; exit 1; }
          all_healthy
          curl -fsS "$HUB_URL/" | grep -qi '<html'

      # On failure, surface what each service logged so the cause is visible
      # without rerunning.
      - name: Dump stack logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE_PATH" ps -a || true
          for svc in azurite api web; do
            echo "::group::$svc"
            docker compose -f "$COMPOSE_FILE_PATH" logs --no-color "$svc" || true
            echo "::endgroup::"
          done

      - name: Stop the stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE_PATH" down || true
